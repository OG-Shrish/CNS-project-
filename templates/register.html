{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}

<div class="gd-auth-wrapper">
  <div class="gd-auth-card">
    <div class="gd-auth-logo">
      <div class="gd-logo-icon" style="width: 48px; height: 48px; font-size: 24px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
      </div>
    </div>
    
    <h1 class="gd-auth-title">Create your Security Account</h1>
    <p class="gd-auth-subtitle">Enter details to access your encrypted key vault</p>

    {% if error %}
    <div class="gd-error-alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="gd-form-group">
        <label class="gd-label">Username</label>
        <input type="text" name="username" class="gd-input" placeholder="Choose a username" required autofocus>
      </div>

      <div class="gd-form-group">
        <label class="gd-label">Password</label>
        <input type="password" name="password" class="gd-input" placeholder="Choose a strong password" required>
      </div>

      <div class="gd-auth-footer">
        <a href="/login" class="gd-auth-switch">Sign in instead</a>
        <button type="submit" class="gd-btn gd-btn-primary" style="padding: 10px 28px;">
          Create
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
